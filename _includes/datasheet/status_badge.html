{%- case include.status -%}
{%- when "active" -%}<span class="ds-badge ds-badge--active">Active</span>
{%- when "preview" -%}<span class="ds-badge ds-badge--preview">Preview</span>
{%- when "nrnd" -%}<span class="ds-badge ds-badge--nrnd"
                         title="Not recommended for new designs">NRND</span>
{%- when "obsolete" -%}<span class="ds-badge ds-badge--obsolete">Obsolete</span>
{%- endcase -%}
