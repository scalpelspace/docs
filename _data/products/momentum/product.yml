# Product data shared by every release. Each release has its own file next
# to this one (rel_a.yml, ...); the file name is the release key.

name: Momentum
tagline: GNSS, 9-DOF IMU and barometer sensor shield
codename: momentum
category: Sensors

# Photo for the product cards and product page.
image: /products/momentum/rel-b/assets/momentum_rel-b-top.png

# Shown on the product page and at the top of every datasheet overview.
description: >-
  A Uno-style footprint sensor integration board that bridges an SPI or CAN
  host to sensor telemetry. It combines a 9-DOF IMU, multi-constellation GNSS
  and a barometric pressure sensor on a single board, allowing rapid
  integration of a full sensor suite into any project with an SPI or CAN bus
  host controller.

# Oldest first. The last entry is the latest release.
releases: [ rel_a, rel_b ]

# Spec ids shown in the product page's release comparison table.
compare: [ imu, supply_prot ]

# Links to firmware and software, which live in their own repositories.
repos:
  - label: momentum
    kind: Firmware
    url: https://github.com/scalpelspace/momentum
    desc: Official STM32L432KC firmware.
  - label: blasher.scalpelspace.com
    kind: Web app
    url: https://blasher.scalpelspace.com
    desc: "In-browser firmware flashing over the STM32 UART bootloader and a serial monitor."
  - label: momentum_driver
    kind: Driver
    url: https://github.com/scalpelspace/momentum_driver
    desc: Host driver (SPI/CAN).
  - label: scalpelspace_momentum
    kind: Arduino library
    url: https://github.com/scalpelspace/scalpelspace_momentum
    desc: Arduino library (SPI).
  - label: scalpelspace_bus
    kind: Arduino library
    url: https://github.com/scalpelspace/scalpelspace_bus
    desc: Arduino library (CAN).
