# Product data shared by every release. Each release has its own file next
# to this one (rel_a.yml, ...); the file name is the release key.

name: Blasher
tagline: USB-C firmware flash and utility tool
codename: blasher
category: Tools

# Photo for the product cards and product page.
# TODO TODO TODO UNCOMMENT:
#image: /products/blasher/rel-a/assets/blasher_rel-a-top.png

# Shown on the product page and at the top of every datasheet overview.
description: >-
  A basic firmware flash and utility tool. It bridges a USB-C host to the
  standard ScalpelSpace 5-pin `UART breakout` through a CP2102N USB-to-UART
  bridge, with `BOOT0` and `NRESET` control for entering a target's UART
  bootloader. Built for use with the Blasher web app at
  [blasher.scalpelspace.com](https://blasher.scalpelspace.com).

# Oldest first. The last entry is the latest release.
releases: [ rel_a ]

# Spec ids shown in the product page's release comparison table.
compare: [ bridge, logic, target_if ]

# Links to firmware and software, which live in their own repositories.
repos:
  - label: blasher.scalpelspace.com
    kind: Web app
    url: https://blasher.scalpelspace.com
    desc: "In-browser firmware flashing over the STM32 UART bootloader and a serial monitor."
