# Product-level data: facts shared by every hardware release of this product.
# Release-specific data lives next to this file, one file per release
# (rel_a.yml, ...). File names are the release keys.

name: Blasher
tagline: USB-C firmware flash and utility tool
codename: blasher
category: Tools

# Photo shown on product cards and the product page (site-relative path).
# TODO TODO TODO UNCOMMENT:
#image: /products/blasher/rel-a/assets/blasher_rel-a-top.png

# Shared description, shown on the product page and at the top of every
# release's datasheet overview. Markdown allowed.
description: >-
  A basic firmware flash and utility tool. It bridges a USB-C host to the
  standard ScalpelSpace 5-pin `UART breakout` through a CP2102N USB-to-UART
  bridge, with `BOOT0` and `NRESET` control for entering a target's UART
  bootloader. Built for use with the Blasher web app at
  [blasher.scalpelspace.com](https://blasher.scalpelspace.com).

# Oldest first. The last entry is treated as the latest release.
releases: [ rel_a ]

# Spec ids (from each release's `specs`) shown in the product page
# release comparison table. Cells that differ from the previous release
# are highlighted.
compare: [ bridge, logic, target_if ]

# Firmware and software live in their own repositories. Docs only link to
# them.
repos:
  - label: blasher.scalpelspace.com
    kind: Web app
    url: https://blasher.scalpelspace.com
    desc: "Main tool: in-browser firmware flashing over the STM32 UART bootloader and a serial monitor."
